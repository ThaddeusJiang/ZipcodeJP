# Manually create and publish a GitHub release from the selected branch and tag.
name: Release (manual)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (for example: 2026.5.25 or 2026.5.25-rc.1)"
        required: true
        type: string
      latest:
        description: "Mark this release as latest and publish the Docker latest tag"
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

concurrency:
  group: release-manual-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    name: release (${{ inputs.tag }})
    runs-on: ubuntu-latest
    outputs:
      is_latest: ${{ steps.prepare.outputs.is_latest }}
      version: ${{ steps.prepare.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Prepare release metadata
        id: prepare
        env:
          INPUT_LATEST: ${{ inputs.latest }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -z "${INPUT_TAG}" ]; then
            echo "Release tag is empty"
            exit 1
          fi

          echo "is_latest=${INPUT_LATEST}" >> "${GITHUB_OUTPUT}"
          echo "version=${INPUT_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Ensure GitHub CLI
        run: gh --version

      - name: Create published GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_LATEST: ${{ inputs.latest }}
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: |
          gh release create "${INPUT_TAG}" \
            --target "${RELEASE_BRANCH}" \
            --title "zipcodejp ${INPUT_TAG}" \
            --generate-notes \
            --latest="${INPUT_LATEST}"

  docker:
    name: docker (${{ needs.release.outputs.version }})
    needs: release
    uses: ./.github/workflows/docker-publish.yml
    with:
      is_latest: ${{ needs.release.outputs.is_latest == 'true' }}
      version: ${{ needs.release.outputs.version }}
    permissions:
      contents: read
      packages: write
    secrets: inherit
